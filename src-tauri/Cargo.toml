[package]
name = "video-broswer"
version = "0.1.0"
description = "魔芋播放器 — multi-site video player with an always-on-top mini window"
authors = ["魔芋播放器 contributors"]
license = "MIT"
edition = "2024"

[lib]
name = "video_broswer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks Window::builder, Window::add_child and Webview::reparent,
# which the multi-tab layout and the mini window depend on. `tray-icon` is the
# bottom-right corner icon the app hides into.
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
